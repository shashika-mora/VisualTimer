name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils

      - name: Build VisualTimer.exe
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          ./build.ps1
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\VisualTimer.exe dist\VisualTimer.exe
          Compress-Archive -Path build\VisualTimer.exe, README.md, LICENSE -DestinationPath dist\VisualTimer-win64.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisualTimer-win64
          path: |
            dist/VisualTimer.exe
            dist/VisualTimer-win64.zip

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/VisualTimer.exe
            dist/VisualTimer-win64.zip
